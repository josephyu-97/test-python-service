kind: Suite
apiVersion: test.gatekeeper.sh/v1alpha1
metadata:
  name: uniqueserviceselector
tests:
- name: unique-service-selector
  template: template.yaml
  constraint: samples/unique-service-selector/constraint.yaml
  cases:
  - name: example-allowed
    object: samples/unique-service-selector/example_allowed.yaml
    assertions:
    - violations: no
  - name: same-namespace-identical-selector
    object: samples/unique-service-selector/example_disallowed.yaml
    inventory:
    - samples/unique-service-selector/example_inventory_disallowed.yaml
    assertions:
    - violations: 1
    - message: service <gatekeeper-test-service-example> in namespace <default>
      violations: 1
  - name: cross-namespace-identical-selector
    object: samples/unique-service-selector/example_disallowed.yaml
    inventory:
    - samples/unique-service-selector/example_inventory_cross_namespace_identical.yaml
    assertions:
    - violations: no
  - name: mixed-namespace-identical-selectors
    object: samples/unique-service-selector/example_disallowed.yaml
    inventory:
    - samples/unique-service-selector/example_inventory_disallowed.yaml
    - samples/unique-service-selector/example_inventory_cross_namespace_identical.yaml
    assertions:
    - violations: 1
    - message: service <gatekeeper-test-service-example> in namespace <default>
      violations: 1
    - message: service <remote-selector-service>
      violations: 0
  - name: one-violation-per-same-namespace-service
    object: samples/unique-service-selector/example_disallowed.yaml
    inventory:
    - samples/unique-service-selector/example_inventory_disallowed.yaml
    - samples/unique-service-selector/example_inventory_disallowed_second.yaml
    assertions:
    - violations: 2
    - message: service <gatekeeper-test-service-example> in namespace <default>
      violations: 1
    - message: service <gatekeeper-test-service-example-second> in namespace <default>
      violations: 1
  - name: omitted-selector-does-not-participate
    object: samples/unique-service-selector/selector_omitted.yaml
    inventory:
    - samples/unique-service-selector/example_inventory_selector_omitted.yaml
    - samples/unique-service-selector/example_inventory_selector_empty.yaml
    - samples/unique-service-selector/example_inventory_selected.yaml
    assertions:
    - violations: no
  - name: empty-selector-does-not-participate
    object: samples/unique-service-selector/selector_empty.yaml
    inventory:
    - samples/unique-service-selector/example_inventory_selector_omitted.yaml
    - samples/unique-service-selector/example_inventory_selector_empty.yaml
    - samples/unique-service-selector/example_inventory_selected.yaml
    assertions:
    - violations: no
  - name: selected-service-ignores-selectorless-inventory
    object: samples/unique-service-selector/example_disallowed.yaml
    inventory:
    - samples/unique-service-selector/example_inventory_selector_omitted.yaml
    - samples/unique-service-selector/example_inventory_selector_empty.yaml
    assertions:
    - violations: no
  - name: compound-selector-key-order-independent
    object: samples/unique-service-selector/compound_selector.yaml
    inventory:
    - samples/unique-service-selector/example_inventory_compound_identical_reordered.yaml
    assertions:
    - violations: 1
    - message: service <compound-selector-identical> in namespace <default>
      violations: 1
  - name: partial-subset-superset-and-overlap-allowed
    object: samples/unique-service-selector/compound_selector.yaml
    inventory:
    - samples/unique-service-selector/example_inventory_partial.yaml
    - samples/unique-service-selector/example_inventory_subset.yaml
    - samples/unique-service-selector/example_inventory_superset.yaml
    - samples/unique-service-selector/example_inventory_overlapping.yaml
    assertions:
    - violations: no
  - name: update-inventoried-service-itself
    object: samples/unique-service-selector/compound_selector.yaml
    inventory:
    - samples/unique-service-selector/compound_selector.yaml
    assertions:
    - violations: no
