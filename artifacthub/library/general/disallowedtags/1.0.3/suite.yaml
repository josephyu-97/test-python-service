kind: Suite
apiVersion: test.gatekeeper.sh/v1alpha1
metadata:
  name: disallowedtags
tests:
- name: disallowed-tags
  template: template.yaml
  constraint: samples/container-image-must-not-have-latest-tag/constraint.yaml
  cases:
  - name: allowed
    object: samples/container-image-must-not-have-latest-tag/example_allowed.yaml
    assertions:
    - violations: no
  - name: exempt-images-with-disallowed-tags
    object: samples/container-image-must-not-have-latest-tag/example_exempt_image_w_disallowed_tag.yaml
    assertions:
    - violations: no
  - name: no-tag
    object: samples/container-image-must-not-have-latest-tag/example_no_tag.yaml
    assertions:
    - violations: yes
  - name: no-tag-with-port
    object: samples/container-image-must-not-have-latest-tag/example_no_tag_w_port.yaml
    assertions:
    - violations: yes
  - name: single-disallowed-tag
    object: samples/container-image-must-not-have-latest-tag/example_disallowed_tag.yaml
    assertions:
    - violations: yes
  - name: single-disallowed-tag-ephemeral
    object: samples/container-image-must-not-have-latest-tag/disallowed_tag_ephemeral.yaml
    assertions:
    - violations: yes
  - name: some-disallow-tags
    object: samples/container-image-must-not-have-latest-tag/example_some_disallowed_tags.yaml
    assertions:
    - violations: yes
  - name: tagged-digest-all-container-types
    object: samples/container-image-must-not-have-latest-tag/tagged_digest_all_container_types.yaml
    assertions:
    - violations: 3
    - message: uses a disallowed tag
      violations: 3
    - message: didn't specify an image tag
      violations: 0
    - message: regular-tagged-digest
      violations: 1
    - message: init-tagged-digest
      violations: 1
    - message: ephemeral-tagged-digest
      violations: 1
  - name: digest-only-all-container-types
    object: samples/container-image-must-not-have-latest-tag/digest_only_all_container_types.yaml
    assertions:
    - violations: 3
    - message: didn't specify an image tag
      violations: 3
    - message: uses a disallowed tag
      violations: 0
    - message: regular-digest-only
      violations: 1
    - message: init-digest-only
      violations: 1
    - message: ephemeral-digest-only
      violations: 1
  - name: permitted-tags-with-and-without-digests
    object: samples/container-image-must-not-have-latest-tag/permitted_tags.yaml
    assertions:
    - violations: 0
  - name: untagged-images-and-allowed-tag-substrings
    object: samples/container-image-must-not-have-latest-tag/untagged_and_tag_substrings.yaml
    assertions:
    - violations: 2
    - message: didn't specify an image tag
      violations: 2
    - message: uses a disallowed tag
      violations: 0
    - message: "container <untagged> didn't specify an image tag"
      violations: 1
    - message: untagged-with-registry-port
      violations: 1
- name: digest-reference-exemptions
  template: template.yaml
  constraint: samples/container-image-must-not-have-latest-tag/constraint_digest_exemptions.yaml
  cases:
  - name: exact-and-wildcard-exempt-digest-references
    object: samples/container-image-must-not-have-latest-tag/exempt_digest_references.yaml
    assertions:
    - violations: 0
